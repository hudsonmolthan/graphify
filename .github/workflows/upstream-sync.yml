name: upstream-sync

# Keep this fork (hudsonmolthan/graphify) current with its upstream
# (safishamsi/graphify) via a MERGE sync — so the fork stays zero-touch-current
# even though its tracked branches carry fork-only commits (e.g. this workflow
# itself, which was merged onto v8).
#
# Design principle — "currency at the source, stability at the consumer":
# the fork tracks upstream so it is always current, but does NOT upgrade any
# consumer. viralclip-studio installs an EXACT PINNED graphify version and
# upgrades only via a deliberate, smoke-gated event — this workflow never
# touches studio.
#
# Why merge (not fast-forward-only): once a fork-only commit lives on a tracked
# branch, a fast-forward from upstream is impossible, so an ff-only sync would
# fail on every upstream advance. A merge keeps the fork current AND preserves
# the fork's own commits. It NEVER rewrites history (no force-push, no reset):
# on a TRUE merge conflict it aborts, opens or comments an issue, and fails the run.

on:
  schedule:
    - cron: '17 7 * * *'   # daily 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/safishamsi/graphify.git
  UPSTREAM_SLUG: safishamsi/graphify
  # Space-separated list of fork branches to keep in sync with the same-named
  # upstream branch. Add branches here as the fork grows (mapping is by name).
  BRANCHES: "v8"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so merges resolve correctly
          # persisted GITHUB_TOKEN credentials let the later `git push` work

      - name: Merge-sync each tracked branch from upstream (never force-push)
        # No GH_TOKEN here — this step runs only git; the push uses the
        # actions/checkout-persisted credentials. (gh is used only in the
        # issue-creation step below, which sets its own GH_TOKEN.)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          git remote add upstream "${UPSTREAM_URL}" 2>/dev/null || git remote set-url upstream "${UPSTREAM_URL}"
          git fetch upstream --prune
          failed=()
          for b in ${BRANCHES}; do
            echo "::group::sync ${b} <- upstream/${b}"
            # Check out the fork's branch if it exists; otherwise seed a brand-new
            # tracked branch straight from upstream (handles the first sync as the
            # fork grows, so a not-yet-existing fork branch doesn't abort the job).
            if git show-ref --verify --quiet "refs/remotes/origin/${b}"; then
              git checkout -B "${b}" "origin/${b}"
            else
              echo "note: ${b} not on the fork yet — seeding from upstream/${b}"
              git checkout -B "${b}" "upstream/${b}"
            fi
            # Fast-forward when possible, otherwise a real merge commit (keeps the
            # fork's own commits). No --force / --hard anywhere.
            if git merge --no-edit "upstream/${b}"; then
              git push origin "${b}"
              echo "ok: ${b} synced from upstream (ff or merge) and pushed"
            else
              # Distinguish a real merge conflict (unmerged paths) from any other
              # git-merge failure (missing upstream/<b>, unrelated histories, repo
              # state, …) so the issue message is accurate. Both fail-safe; neither
              # force-pushes or resets.
              if git ls-files -u | grep -q .; then
                echo "::error::merge CONFLICT syncing ${b} <- upstream/${b}"
                failed+=("${b}: merge conflict")
              else
                echo "::error::git merge FAILED (non-conflict) for ${b} <- upstream/${b}"
                failed+=("${b}: merge failed (non-conflict — see run log)")
              fi
              git merge --abort 2>/dev/null || true
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf -v joined '%s; ' "${failed[@]}"
            echo "SYNC_FAILED=1" >> "${GITHUB_ENV}"
            echo "FAILED_BRANCHES=${joined%; }" >> "${GITHUB_ENV}"
          fi

      - name: On a sync failure, open/comment an issue (never force-push)
        if: ${{ env.SYNC_FAILED == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="upstream-sync: could not reconcile with ${UPSTREAM_SLUG} — manual attention needed"
          body="\`upstream-sync\` could not reconcile with \`${UPSTREAM_SLUG}\`: **${FAILED_BRANCHES}**. The merge was aborted and this fork's history is untouched (never force-pushed/reset). Reconcile by hand (resolve a conflict locally, or rebase the fork commits onto upstream). Run: ${run_url}"
          # `// empty` so an empty result is the empty string (not the literal "null"),
          # making the create path run on the first failure.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title upstream-sync could not reconcile" --json number --jq '.[0].number // empty' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

      - name: Fail the run on a sync failure
        if: ${{ env.SYNC_FAILED == '1' }}
        run: |
          echo "Could not reconcile with ${UPSTREAM_SLUG}; see the issue above."
          exit 1
